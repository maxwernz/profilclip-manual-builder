[project]
name = "manual-builder"
version = "0.1.0"
description = "Betriebsanleitungen aus Word-Modulen zusammenstellen (Inhaltsverzeichnis, Seitenzahlen, Störungslisten)"
authors = [
    { name = "Max Wernz", email = "mawernz@outlook.de" }
]
requires-python = ">=3.12"
dependencies = [
    "docxcompose>=2.2.0",
    "lxml>=6.1.3",
    "pyside6>=6.12.0",
    "python-docx>=1.2.0",
    "pywin32>=306 ; sys_platform == 'win32'",
    "pyyaml>=6.0.3",
]

[project.scripts]
manual-builder = "manual_builder:main"

[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
]
