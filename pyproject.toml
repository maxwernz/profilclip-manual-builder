[project]
name = "manual-builder"
version = "0.2.1"
description = "Betriebsanleitungen aus Word-Modulen zusammenstellen (Inhaltsverzeichnis, Seitenzahlen, Störungslisten)"
authors = [{ name = "Profi L-Clip GmbH" }]
requires-python = ">=3.12"
dependencies = [
    "certifi>=2026.10.19",
    "docxcompose>=2.2.0",
    "lxml>=6.1.3",
    "pyside6>=6.12.0",
    "python-docx>=1.2.0",
    "pywin32>=306 ; sys_platform == 'win32'",
    "pyyaml>=6.0.3",
    "truststore>=0.10.5",
]

[project.scripts]
manual-builder = "manual_builder:main"

[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pillow>=13.0.0",
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
]
