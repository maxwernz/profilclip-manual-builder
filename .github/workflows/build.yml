name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No manuals or documents in the repository
        run: |
          if git ls-files | grep -iE '\.(docx?|pdf)$'; then
            echo "::error::Word/PDF-Dateien dürfen nicht ins Repository (Anleitungen sind vertraulich)"; exit 1; fi
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --managed-python
      - run: uv run pytest -q
        env: {CI: "1"}
