name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest -q

  package:
    # packaging only on demand (Actions → Build → Run workflow) or for version tags
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: PyInstaller
        working-directory: packaging
        run: uv run pyinstaller manual_builder.spec --noconfirm --distpath ../dist --workpath ../build
      - name: Zip (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path "dist/Manual Builder" -DestinationPath ManualBuilder-windows.zip
      - name: Zip (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/Manual Builder.app" ManualBuilder-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ManualBuilder-${{ runner.os }}
          path: ManualBuilder-*.zip
