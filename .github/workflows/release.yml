name: Release

# Push a version tag (must match __version__), e.g.:
#   git tag v0.3.0 && git push origin v0.3.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest      # Windows x64 → Setup.exe
          - os: macos-latest        # Apple Silicon
          - os: macos-15-intel      # Intel Macs
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --managed-python
      - name: Tests
        run: uv run pytest -q
        env: {CI: "1"}
      - name: Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build package (includes self-test of the built app)
        run: uv run python tools/build_release.py
      - name: Install with Setup.exe and test the installed app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem release -Recurse -Filter *-Setup.exe | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/LOG=install.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log; exit 1 }
          Start-Sleep -Seconds 8
          Get-Process "Anleitungs-Baukasten" -ErrorAction SilentlyContinue | Stop-Process -Force
          $dir = "$env:LOCALAPPDATA\Programs\Anleitungs-Baukasten"
          if (-not (Test-Path "$dir\unins000.exe")) { Write-Error "Uninstaller fehlt"; exit 1 }
          $t = Start-Process "$dir\Anleitungs-Baukasten.exe" -ArgumentList 'self-test','--out',"$PWD\installed.json" -Wait -PassThru
          Get-Content installed.json
          if ($t.ExitCode -ne 0) { exit 1 }
          # silent re-install over a running copy = what an update does
          Start-Process "$dir\Anleitungs-Baukasten.exe"
          Start-Sleep -Seconds 8
          $p = Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CLOSEAPPLICATIONS','/LOG=update.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content update.log; exit 1 }
          Start-Sleep -Seconds 8
          Get-Process "Anleitungs-Baukasten" -ErrorAction SilentlyContinue | Stop-Process -Force
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}
          path: release/*/*
          if-no-files-found: error

  publish:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dl
          merge-multiple: true
      - name: latest.json
        run: python3 tools/publish_update.py dl --to out --require windows-x64,macos-arm64
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('out/latest.json'))['version'])")
          python3 -c "import json;print(json.load(open('out/latest.json'))['notes'])" > notes.md
          gh release create "v$VERSION" --title "Anleitungs-Baukasten $VERSION" --notes-file notes.md \
            out/* dl/*.dmg dl/asset-*.json
