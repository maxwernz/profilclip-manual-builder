name: Release

# Push a version tag (must match __version__), e.g.:
#   git tag v0.3.0 && git push origin v0.3.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest      # Windows x64 → Setup.exe
          - os: macos-latest        # Apple Silicon
          - os: macos-15-intel      # Intel Macs
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --managed-python
      - name: Tests
        run: uv run pytest -q
        env: {CI: "1"}
      - name: Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build package (includes self-test of the built app)
        run: uv run python tools/build_release.py
      - name: Install with Setup.exe and test the installed app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 10
        run: |
          # Note: Start-Process -Wait would also wait for the app the setup launches at the end,
          # so wait for the setup process only.
          function Run-Setup($setupArgs, $log) {
            $setup = Get-ChildItem release -Recurse -Filter *-Setup.exe | Select-Object -First 1
            $p = Start-Process $setup.FullName -ArgumentList ($setupArgs + "/LOG=$log") -PassThru
            if (-not $p.WaitForExit(300000)) { Write-Error "Setup hängt"; exit 1 }
            if ($p.ExitCode -ne 0) { Get-Content $log; Write-Error "Setup-Fehler $($p.ExitCode)"; exit 1 }
          }
          $dir = "$env:LOCALAPPDATA\Programs\Anleitungs-Baukasten"
          $exe = "$dir\Anleitungs-Baukasten.exe"

          Run-Setup @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') "install.log"
          Start-Sleep -Seconds 5
          if (-not (Get-Process "Anleitungs-Baukasten" -ErrorAction SilentlyContinue)) { Write-Error "App wurde nach der Installation nicht gestartet"; exit 1 }
          Get-Process "Anleitungs-Baukasten" | Stop-Process -Force
          if (-not (Test-Path "$dir\unins000.exe")) { Write-Error "Uninstaller fehlt"; exit 1 }

          $t = Start-Process $exe -ArgumentList 'self-test','--out',"$PWD\installed.json" -PassThru
          if (-not $t.WaitForExit(120000)) { Write-Error "Selbsttest hängt"; exit 1 }
          Get-Content installed.json
          if ($t.ExitCode -ne 0) { exit 1 }

          # an update = silent setup while the app is running
          Start-Process $exe | Out-Null
          Start-Sleep -Seconds 6
          Run-Setup @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CLOSEAPPLICATIONS') "update.log"
          Start-Sleep -Seconds 5
          if (-not (Get-Process "Anleitungs-Baukasten" -ErrorAction SilentlyContinue)) { Write-Error "App wurde nach dem Update nicht neu gestartet"; exit 1 }
          Get-Process "Anleitungs-Baukasten" | Stop-Process -Force
          Write-Host "Installation und Update ok"
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}
          path: release/*/*
          if-no-files-found: error

  publish:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dl
          merge-multiple: true
      - name: latest.json
        run: python3 tools/publish_update.py dl --to out --require windows-x64,macos-arm64
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('out/latest.json'))['version'])")
          python3 -c "import json;print(json.load(open('out/latest.json'))['notes'])" > notes.md
          gh release create "v$VERSION" --title "Anleitungs-Baukasten $VERSION" --notes-file notes.md \
            out/* $(find dl -name '*.dmg') $(find dl -name 'asset-*.json')
